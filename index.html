<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test - ゲームアカウントマーケット</title>
    <style>
        /* --- 基本設定 --- */
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent: #ffffff;
            --border: #333333;
            --btn-bg: #222222;
            --btn-hover: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; padding: 0; margin: 0; }

        /* --- ヘッダー --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: bold; font-size: 1.2rem; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { font-size: 0.9rem; color: var(--text-sub); transition: 0.3s; }
        .nav-links a:hover { color: var(--text-main); }
        
        .btn-login {
            background: var(--btn-bg);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .btn-login:hover { background: var(--btn-hover); }

        /* --- ヒーローセクション --- */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at 80% 30%, #1a1a1a 0%, #000000 60%);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-sub);
            margin-bottom: 25px;
            font-size: 1rem;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pill-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .pill-btn:hover { background: var(--btn-hover); }

        .hero-img {
            margin-top: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffcc00, #ff6600); /* 仮のアイコン */
            display: inline-block;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
        }

        /* --- カテゴリセクション --- */
        .section-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .section-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }

        .game-icon {
            width: 60px;
            height: 60px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
        }

        .game-icon:hover, .game-icon.active {
            border-color: var(--text-main);
            color: var(--text-main);
            background: #222;
            transform: translateY(-2px);
        }

        /* --- フィルターセクション --- */
        .filter-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .filter-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff00;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-input {
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
        }

        .search-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }
        .search-btn:hover { background: #0056b3; }

        /* --- フッター --- */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="logo">NekoShop</div>
        <nav class="nav-links">
            <a href="#">サポート</a>
            <a href="#" class="btn-login">マイページ</a>
        </nav>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <h1>ゲームアカウント一覧</h1>
        <p>価格、ランク、スキン数、残高を見比べながら選べるアカウントマーケットです。</p>
        
        <div class="hero-buttons">
            <button class="pill-btn">メール変更可能</button>
            <button class="pill-btn">国制限なし</button>
            <button class="pill-btn">Discord Support</button>
        </div>

        <!-- 画像のかわりにCSSで丸を作っています -->
        <div class="hero-img"></div> 
    </section>

    <!-- カテゴリセクション -->
    <div class="section-container">
        <div class="section-title">カテゴリー</div>
        <div class="section-desc">アイコンをクリックして対象カテゴリーを選択できます</div>

        <div class="game-grid" id="gameGrid">
            <!-- ゲームアイコンのダミー -->
            <!-- 実際は画像を入れるところ -->
            <div class="game-icon active" onclick="selectGame(this)">Steam</div>
            <div class="game-icon" onclick="selectGame(this)">TT</div>
            <div class="game-icon" onclick="selectGame(this)">FF</div>
            <div class="game-icon" onclick="selectGame(this)">M</div>
            <div class="game-icon" onclick="selectGame(this)">EA</div>
            <div class="game-icon" onclick="selectGame(this)">Blz</div>
            <div class="game-icon" onclick="selectGame(this)">MC</div>
            <div class="game-icon" onclick="selectGame(this)">SC</div>
            <div class="game-icon" onclick="selectGame(this)">Rob</div>
            <div class="game-icon" onclick="selectGame(this)">GTA</div>
            <div class="game-icon" onclick="selectGame(this)">H</div>
            <div class="game-icon" onclick="selectGame(this)">Epic</div>
            <div class="game-icon" onclick="selectGame(this)">Gift</div>
            <!-- 2行目 -->
            <div class="game-icon" onclick="selectGame(this)">PS</div>
            <div class="game-icon" onclick="selectGame(this)">RP</div>
            <div class="game-icon" onclick="selectGame(this)">Disc</div>
            <div class="game-icon" onclick="selectGame(this)">TTK</div>
            <div class="game-icon" onclick="selectGame(this)">Insta</div>
            <div class="game-icon" onclick="selectGame(this)">AI</div>
            <div class="game-icon" onclick="selectGame(this)">Valo</div>
            <div class="game-icon" onclick="selectGame(this)">VPN</div>
            <div class="game-icon" onclick="selectGame(this)">M</div>
            <div class="game-icon" onclick="selectGame(this)">H1</div>
            <div class="game-icon" onclick="selectGame(this)">Red</div>
        </div>

        <!-- フィルターセクション -->
        <div class="filter-card">
            <div class="filter-header">
                <div class="status-dot"></div>
                基本条件
            </div>
            
            <div class="filter-grid">
                <!-- 価格帯 -->
                <div class="filter-group">
                    <span class="filter-label">価格帯 (¥)</span>
                    <div class="input-row">
                        <input type="number" class="filter-input" placeholder="最小">
                        <span>-</span>
                        <input type="number" class="filter-input" placeholder="最大">
                    </div>
                </div>

                <!-- インベントリ数 -->
                <div class="filter-group">
                    <span class="filter-label">インベントリ数 (件)</span>
                    <div class="input-row">
                        <input type="number" class="filter-input" placeholder="最小">
                        <span>-</span>
                        <input type="number" class="filter-input" placeholder="最大">
                    </div>
                </div>

                <!-- 未アクティブ期間 -->
                <div class="filter-group">
                    <span class="filter-label">未アクティブ期間 (最終ログイン)</span>
                    <select class="filter-input">
                        <option>例: 1ヶ月以内</option>
                        <option>3ヶ月以内</option>
                        <option>1年以内</option>
                        <option>制限なし</option>
                    </select>
                </div>

                <!-- メール種類 -->
                <div class="filter-group">
                    <span class="filter-label">メール種類</span>
                    <select class="filter-input">
                        <option>指定なし</option>
                        <option>gmail</option>
                        <option>yahoo</option>
                        <option>outlook</option>
                    </select>
                </div>
            </div>

            <button class="search-btn">検索する</button>
        </div>
    </div>

    <footer>
        &copy; 2024 NekoShop. All rights reserved.
    </footer>

    <script>
        // アイコン選択の動き
        function selectGame(element) {
            // 全アイコンのアクティブを解除
            document.querySelectorAll('.game-icon').forEach(icon => {
                icon.classList.remove('active');
            });
            // クリックされたものにアクティブを追加
            element.classList.add('active');
            
            // 簡易的なアラート（本来は検索結果を更新する処理が入ります）
            console.log("Selected: " + element.innerText);
        }
    </script>
</body>
</html>
